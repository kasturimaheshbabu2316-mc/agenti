<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMM 3 – All-In-One Command Hub</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="hub-body">

  <header class="hub-top">
    <div class="hub-brand">
      <h1>PMM<span>3</span></h1>
      <span class="hub-badge">All-In-One Hub</span>
      <span id="syncBadge" class="sync-badge offline" title="Multi-device synchronization status"><i></i><span class="sync-text">Local Mode</span></span>
    </div>

    <nav class="hub-nav" aria-label="Portal Navigation Tabs">
      <button class="hub-tab active" type="button" data-view="team" aria-current="page">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/></svg>
        Team Page
      </button>

      <button class="hub-tab" type="button" data-view="admin">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8L3.5 9.2l5.9-.9L12 3z"/></svg>
        Quiz Master
      </button>

      <button class="hub-tab" type="button" data-view="live">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        Score Board
      </button>

      <button class="hub-tab" type="button" data-view="mcq">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        MCQ Showcase
      </button>

      <button class="hub-tab" type="button" data-view="split">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg>
        Dual View
      </button>
    </nav>

    <div class="hub-actions">
      <button id="hubOpenBtn" class="hub-btn-icon" type="button" title="Open current view in new window" aria-label="Open in new window">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
      <button id="hubFsBtn" class="hub-btn-icon" type="button" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <main class="hub-content" id="hubContent">
    <iframe id="mainFrame" class="hub-frame" src="index.html" title="Active PMM 3 View"></iframe>
    <div id="splitWrap" class="hub-split" hidden>
      <div class="hub-panel">
        <div class="hub-panel-head">
          <span>Team Bidding Terminal</span>
          <a href="index.html" target="_blank" rel="noopener">Popout ↗</a>
        </div>
        <div class="hub-panel-body">
          <iframe id="splitFrameTeam" src="index.html" title="Team View Split"></iframe>
        </div>
      </div>
      <div class="hub-panel">
        <div class="hub-panel-head">
          <span>Quiz Master Management</span>
          <a href="admin.html" target="_blank" rel="noopener">Popout ↗</a>
        </div>
        <div class="hub-panel-body">
          <iframe id="splitFrameAdmin" src="admin.html" title="Quiz Master View Split"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script>
    (function () {
      "use strict";

      const VIEWS = {
        team: "index.html",
        admin: "admin.html",
        live: "live.html",
        mcq: "mcq.html"
      };

      let activeView = "team";
      const mainFrame = document.getElementById("mainFrame");
      const splitWrap = document.getElementById("splitWrap");
      const openBtn = document.getElementById("hubOpenBtn");
      const fsBtn = document.getElementById("hubFsBtn");
      const tabs = document.querySelectorAll(".hub-tab");

      function setView(viewKey) {
        activeView = viewKey;
        tabs.forEach((tab) => {
          const isActive = tab.dataset.view === viewKey;
          tab.classList.toggle("active", isActive);
          if (isActive) {
            tab.setAttribute("aria-current", "page");
          } else {
            tab.removeAttribute("aria-current");
          }
        });

        if (viewKey === "split") {
          mainFrame.hidden = true;
          splitWrap.hidden = false;
        } else {
          splitWrap.hidden = true;
          mainFrame.hidden = false;
          mainFrame.src = VIEWS[viewKey] || "index.html";
        }
      }

      document.querySelector(".hub-nav").addEventListener("click", (e) => {
        const tab = e.target.closest(".hub-tab");
        if (!tab) return;
        setView(tab.dataset.view);
      });

      openBtn.addEventListener("click", () => {
        const targetUrl = activeView === "split" ? "index.html" : (VIEWS[activeView] || "index.html");
        window.open(targetUrl, "_blank", "noopener");
      });

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "1") setView("team");
        if (e.key === "2") setView("admin");
        if (e.key === "3") setView("live");
        if (e.key === "4") setView("mcq");
        if (e.key === "d" || e.key === "D") setView("split");
        if (e.key === "f" || e.key === "F") {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
