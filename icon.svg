<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="50%" stop-color="#0e1223"/>
      <stop offset="100%" stop-color="#161c36"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee7f8"/>
      <stop offset="50%" stop-color="#c4b5f5"/>
      <stop offset="100%" stop-color="#ffb38a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  
  <!-- Stylized Matrix Grid -->
  <g stroke="rgba(126,231,248,0.14)" stroke-width="2" stroke-dasharray="6,6">
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="384" y1="80" x2="384" y2="432"/>
    <line x1="80" y1="128" x2="432" y2="128"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="384" x2="432" y2="384"/>
  </g>

  <!-- Central Pill & Matrix Emblem -->
  <g filter="url(#glow)">
    <!-- Pill Capsule (Rotated 45deg) -->
    <g transform="translate(256, 256) rotate(-45)">
      <rect x="-60" y="-130" width="120" height="130" rx="60" fill="url(#neonGrad)"/>
      <rect x="-60" y="0" width="120" height="130" rx="60" fill="#0e1223" stroke="url(#neonGrad)" stroke-width="8"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="6"/>
    </g>
  </g>

  <!-- Typography PMM 3 -->
  <text x="256" y="468" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#f8fafc" letter-spacing="4">
    PMM<tspan fill="#7ee7f8">3</tspan>
  </text>
</svg>
