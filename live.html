<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMM 3 – Live bidding board</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="live">
  <div class="lwrap">
    <header class="ltop">
      <h1 class="brand">PMM<span>3</span><small>Live bidding board · Pharmaceutics Mastery Matrix 3</small></h1>
      <span class="livepill"><i></i>LIVE</span>
      <span id="syncBadge" class="sync-badge offline" title="Multi-device synchronization status"><i></i><span class="sync-text">Local Mode</span></span>
      <nav class="menu lmenu" aria-label="Pages">
        <a href="hub.html" title="All-In-One Unified Hub">All-In-One Hub</a>
        <a class="on" href="live.html" aria-current="page">Score Board</a>
        <a href="index.html">Team page</a>
        <a href="admin.html">Quiz master</a>
        <a href="mcq.html">MCQ Matrix</a>
      </nav>
      <div class="lctl">
        <button id="sfxBtnLive" class="ghost" type="button" aria-label="Toggle hall sound effects">Sound: On</button>
        <button id="prevQ" class="ghost" type="button" aria-label="Previous question">‹</button>
        <button id="autoQ" class="ghost" type="button">Auto</button>
        <button id="nextQ" class="ghost" type="button" aria-label="Next question">›</button>
        <button id="fsBtn" class="ghost" type="button">Full screen</button>
        <span id="clock" aria-hidden="true"></span>
      </div>
    </header>

    <div id="flash" class="flash" role="status" aria-live="assertive"></div>

    <main class="lgrid">
      <div class="lleft">
        <div id="others" class="others"></div>
        <section class="card lmain" id="main" aria-live="polite"></section>
      </div>
      <div class="lside">
        <section class="card" id="board" aria-label="Scoreboard"></section>
        <section class="card" id="feed2" aria-label="Live activity"></section>
      </div>
    </main>
    <p class="lhint">Keys: ← → switch question · A auto-follow · F full screen</p>
  </div>

  <script src="store.js"></script>
  <script src="sync.js"></script>
  <script src="rag.js"></script>
  <script src="agents.js"></script>
  <script src="sfx.js"></script>
  <script src="live.js"></script>
  <script src="particles.js"></script>
  <script src="spotlight.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
